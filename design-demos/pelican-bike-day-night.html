:root{--sky1:#f6b56d;--sky2:#f7dd9d;--sea1:#4ca8ad;--sea2:#176078;--night:0;--x:0px;--bob:0px;--spin:0deg}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#102c3a}body{display:grid;place-items:center;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.stage{position:relative;width:min(100vw,1200px);aspect-ratio:12/7;overflow:hidden;background:#f4d39a}svg{display:block;width:100%;height:100%}.day{opacity:calc(1 - var(--night))}.night{opacity:var(--night)}.ride{transform:translateX(var(--x)) translateY(var(--bob))}.wheel{transform-box:fill-box;transform-origin:center;transform:rotate(var(--spin))}.cloud{animation:drift 20s linear infinite}.wave{animation:wave 3s ease-in-out infinite}.wave:nth-child(2){animation-delay:-1.2s}.star{animation:twinkle 2.8s ease-in-out infinite alternate}.star:nth-child(2n){animation-delay:-1s}.control{position:absolute;right:22px;top:18px;z-index:5;display:flex;gap:8px}.control button{border:1px solid #ffffff80;border-radius:999px;padding:8px 14px;background:#102d3938;color:#fff;cursor:pointer;backdrop-filter:blur(10px);font:inherit}.title{position:absolute;z-index:4;left:28px;top:22px;color:#fff;text-shadow:0 2px 16px #1a384040;pointer-events:none}.title strong{display:block;letter-spacing:.16em;font-size:clamp(12px,1.35vw,18px)}.title span{display:block;margin-top:5px;font-size:clamp(11px,1.1vw,15px);opacity:.85;letter-spacing:.08em}.caption{position:absolute;z-index:4;left:29px;bottom:24px;color:#fffc;font-size:clamp(10px,1vw,13px);letter-spacing:.13em;pointer-events:none}@keyframes twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.25)}}@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}@keyframes drift{from{transform:translateX(-100px)}to{transform:translateX(1250px)}}
</style></head><body><main class="stage" aria-label="鹈鹕在海边骑自行车，天空从白昼循环到夜晚的 SVG 动画"><div class="title"><strong>COASTAL LOOP</strong><span>鹈鹕的海边昼夜骑行</span></div><div class="control no-record"><button id="toggle">暂停</button><button id="speed">速度 1×</button></div><div class="caption">FOLLOW THE TIDE · 太阳落下，月亮升起</div>

<script>(()=>{const r=document.documentElement,toggle=document.getElementById('toggle'),speedBtn=document.getElementById('speed'),duration=30000;let playing=true,speed=1,elapsed=0,last=null;const hex=h=>h.match(/[\da-f]{2}/gi).map(v=>parseInt(v,16));const mix=(a,b,n)=>{const x=hex(a),y=hex(b);return'#'+x.map((v,i)=>Math.round(v+(y[i]-v)*n).toString(16).padStart(2,'0')).join('')};function render(t){const p=t/duration,n=(Math.sin(p*Math.PI*2-Math.PI/2)+1)/2;r.style.setProperty('--night',n.toFixed(3));r.style.setProperty('--sky1',mix('#f6b56d','#182c58',n));r.style.setProperty('--sky2',mix('#f7dd9d','#4a3e78',n));r.style.setProperty('--sea1',mix('#4ca8ad','#315d86',n));r.style.setProperty('--sea2',mix('#176078','#101f45',n));r.style.setProperty('--x',(((p*2)%1)*520-170)+'px');r.style.setProperty('--bob',Math.sin(p*Math.PI*24)*2.2+'px');r.style.setProperty('--spin',p*3240+'deg')}function tick(now){if(last===null)last=now;const dt=now-last;last=now;if(playing)elapsed=(elapsed+dt*speed)%duration;render(elapsed);requestAnimationFrame(tick)}toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'暂停':'播放'};speedBtn.onclick=()=>{speed=speed===1?1.6:speed===1.6?.6:1;speedBtn.textContent='速度 '+speed+'×'};window.__seek=t=>{elapsed=(Number(t)||0)%duration;render(elapsed)};window.__ready=true;render(0);requestAnimationFrame(tick)})();</script></body></html>
