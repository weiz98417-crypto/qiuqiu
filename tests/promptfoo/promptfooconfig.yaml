# promptfoo 观测层配置（openspec/changes/promptfoo-observability）。
#
# 两层分界立法：
#   - 门禁层 = 自建确定性 eval runner（backend/internal/evals + tests/evals，
#     232+ 用例回放型）——promptfoo 的任何结论**永不**参与门禁判定；
#   - 观测层 = 本配置：judge（llm-rubric）只出报告（措辞质量/口吻一致性），
#     flaky 不影响 CI 结论。验证方式：故意让 judge 失败，pr tier 结论不变。
#
# 前置：demo server 运行中（QIUQIU_DEMO_ACCOUNTS=1 场景，默认
# http://127.0.0.1:18090）。provider 经 WS user_speech 走真实全栈
# （router→policy→realizer），不是裸 LLM 调用。
#
# 用法：npx promptfoo view -c tests/promptfoo/promptfooconfig.yaml
#       （或 npx promptfoo eval -c tests/promptfoo/promptfooconfig.yaml）
# 矩阵（prompt×model）后置：启用条件=换模型/AB 需求出现（届时加
# providers 列表即可，配置形态不变）。

description: qiuqiu 球球口吻观测（judge 只观测，不挡门）

prompts:
  - "{{text}}"

providers:
  - id: exec: node scripts/promptfoo/realize.mjs --text "{{text}}"
    label: qiuqiu-realize-ws
    config:
      base-url: {{env.QIUQIU_BASE_URL | default('http://127.0.0.1:18090', true)}}

defaultTest:
  options:
    # judge 供应商走环境变量 PROMPTFOO_LLM_BASE_URL/KEY（openai-compat，
    # demo 场景可用 mimo）；未配置时 judge 用例失败——只影响观测报告，
    # 不影响任何门禁。
    provider:
      id: http://{{env.PROMPTFOO_LLM_BASE_URL | default('127.0.0.1:18090/v1', true)}}/chat/completions
      config:
        apiKey: "{{env.PROMPTFOO_LLM_API_KEY | default('', true)}}"
        model: "{{env.PROMPTFOO_LLM_MODEL | default('mimo-v2.5', true)}}"
  assert:
    - type: llm-rubric
      value: 回复像熟悉的朋友陪看球的口吻，不像播音腔或客服；不编造与问题无关的比赛事实。
    - type: javascript
      value: output.length > 0 && output.length <= 200

tests:
  - vars: { text: "现在几比几？" }
  - vars: { text: "刚才谁进球了？" }
  - vars: { text: "今天有什么比赛？" }
  - vars: { text: "你支持哪个队啊？" }
