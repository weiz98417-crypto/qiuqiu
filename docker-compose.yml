services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - APP_TOKEN=${APP_TOKEN:?APP_TOKEN is required}
      - APP_TOKEN_SECONDARY=${APP_TOKEN_SECONDARY:-}
      - AUTH_MODE=session
      - SESSION_SIGNING_KEY=${SESSION_SIGNING_KEY:?SESSION_SIGNING_KEY is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      - DATABASE_URL=postgres://qiuqiu:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/qiuqiu?sslmode=disable
      - REDIS_ADDR=redis:6379
      - MIMO_API_KEY=${MIMO_API_KEY:?MIMO_API_KEY is required}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      - MIMO_MODEL=${MIMO_MODEL:-mimo-v2.5-pro}
      - MIMO_VOICE=${MIMO_VOICE:-冰糖}
      - COMPANION_REALIZER_TIMEOUT_MS=${COMPANION_REALIZER_TIMEOUT_MS:-5000}
      - APISPORTS_API_KEY=${APISPORTS_API_KEY:-}
      - APISPORTS_BASE_URL=${APISPORTS_BASE_URL:-https://v3.football.api-sports.io}
      - PRIVACY_RETENTION_DAYS=${PRIVACY_RETENTION_DAYS:-30}
      - PENDING_OBSERVATION_COORDINATION=${PENDING_OBSERVATION_COORDINATION:-true}
      - FACT_LEDGER_PUBLIC_READS=${FACT_LEDGER_PUBLIC_READS:-true}
      - MEMOBASE_URL=${MEMOBASE_URL:-http://memobase:8000}
      - MEMOBASE_TOKEN=${MEMOBASE_TOKEN:-secret}
      - MEMOBASE_EXTRACTION_TIMEOUT_MS=${MEMOBASE_EXTRACTION_TIMEOUT_MS:-10000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      memobase:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=qiuqiu
      - POSTGRES_USER=qiuqiu
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # 唯一全量事实源（画像/事实账本），备份与恢复见 deploy/README.md
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qiuqiu -d qiuqiu"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Memobase: mutable memory synthesis (user portrait, event summaries) behind
  # backend/internal/memory. ADR-0006: the Interaction Ledger stays the local,
  # append-only fact source; Memobase never sees Match Facts writes.
  # Extraction LLM reuses the backend adapter credentials (MIMO_*).
  memobase:
    image: ghcr.io/memodb-io/memobase:latest
    environment:
      - DATABASE_URL=postgresql://memobase:${MEMOBASE_POSTGRES_PASSWORD:?MEMOBASE_POSTGRES_PASSWORD is required}@memobase-postgres:5432/memobase
      - REDIS_URL=redis://memobase-redis:6379/0
      - ACCESS_TOKEN=${MEMOBASE_TOKEN:-secret}
      - PROJECT_ID=qiuqiu
      - MEMOBASE_LLM_API_KEY=${MIMO_API_KEY:?MIMO_API_KEY is required}
      - MEMOBASE_LLM_BASE_URL=${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      - MEMOBASE_BEST_LLM_MODEL=${MIMO_MODEL:-mimo-v2.5-pro}
      # 语义记忆开关（openspec/changes/memory-into-turns 独立任务 A）：
      # 本地 Ollama 跑 bge-m3（用户裁决：本地模型、无 key、无外部依赖）。
      # 宿主机起 ollama serve（OLLAMA_MODELS=D:\ollama\models），容器经
      # host.docker.internal 访问；API_KEY 为 OpenAI 兼容形态的占位串。
      - MEMOBASE_ENABLE_EVENT_EMBEDDING=${MEMOBASE_ENABLE_EVENT_EMBEDDING:-false}
      - MEMOBASE_EMBEDDING_PROVIDER=${MEMOBASE_EMBEDDING_PROVIDER:-openai}
      - MEMOBASE_EMBEDDING_API_KEY=${MEMOBASE_EMBEDDING_API_KEY:-ollama}
      - MEMOBASE_EMBEDDING_BASE_URL=${MEMOBASE_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      - MEMOBASE_EMBEDDING_DIM=${MEMOBASE_EMBEDDING_DIM:-1024}
      - MEMOBASE_EMBEDDING_MODEL=${MEMOBASE_EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ./deploy/memobase/config.yaml:/app/config.yaml
    ports:
      - "8019:8000"
    depends_on:
      memobase-postgres:
        condition: service_healthy
      memobase-redis:
        condition: service_healthy
    restart: unless-stopped

  # Dedicated storage for Memobase only — never shared with QiuQiu's pg/redis.
  memobase-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=memobase
      - POSTGRES_USER=memobase
      - POSTGRES_PASSWORD=${MEMOBASE_POSTGRES_PASSWORD:?MEMOBASE_POSTGRES_PASSWORD is required}
    volumes:
      - memobase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memobase -d memobase"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  memobase-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  memobase_postgres_data:
