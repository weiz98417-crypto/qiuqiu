name: qiuqiu
description: 球球 - AI 足球陪看应用
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.3.0
  flutter_soloud: ^2.1.0
  audio_session: ^0.1.21
  share_plus: ^10.0.0
  record: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/live2d/
    - assets/live2d/models/qiuqiu/
    - assets/live2d/models/qiuqiu/expressions/
    - assets/live2d/models/qiuqiu/motions/
    - assets/live2d/models/qiuqiu/female_01Arkit_6.4096/
    - assets/live2d/cubismcore/
