  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
  canvas { display:block; width:100%; height:100%; }

<body>
<canvas id="live2d"></canvas>
<script type="module">
// Real lip sync: wLipSync (WASM MFCC -> visemes, vendored under vendor/wlipsync/)
// analyzes the queued TTS audio. Playback stays in the Flutter player (native
// soloud / top-window Audio); this iframe only taps the bytes for mouth
// driving. When the analyser is unavailable the mouth falls back to the audio
// envelope, then to the legacy random jitter.
(function() {
    var state = { ctx: null, node: null, buffer: null, source: null, startedAt: 0, pendingStart: false };

    function ensureCtx() {
        if (!state.ctx) {
            var Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            state.ctx = new Ctx();
            document.addEventListener('pointerdown', function() {
                if (state.ctx && state.ctx.state === 'suspended') {
                    state.ctx.resume().catch(function() {});
                }
            }, true);
        }
        return state.ctx;
    }

    (async function() {
        try {
            var wlipsync = await import('/live2d-assets/vendor/wlipsync/wlipsync-single.js');
            var profileResp = await fetch('/live2d-assets/vendor/wlipsync/profile.bin');
            var profile = wlipsync.parseBinaryProfile(await profileResp.arrayBuffer());
            var ctx = ensureCtx();
            if (!ctx) return;
            state.node = await wlipsync.createWLipSyncNode(ctx, profile);
        } catch (e) {
            console.warn('wLipSync unavailable, using envelope fallback:', e);
        }
    })();

    window.qLipSync = {
        queue: function(dataUrl) {
            var ctx = ensureCtx();
            if (!ctx) return;
            state.buffer = null;
            state.pendingStart = false;
            fetch(dataUrl).then(function(resp) { return resp.arrayBuffer(); })
                .then(function(bytes) { return ctx.decodeAudioData(bytes); })
                .then(function(decoded) {
                    state.buffer = decoded;
                    if (state.pendingStart) {
                        state.pendingStart = false;
                        window.qLipSync.start();
                    }
                })
                .catch(function(e) { console.warn('lip sync decode failed:', e); });
        },
        start: function() {
            var ctx = ensureCtx();
            if (!ctx) return;
            if (!state.buffer) {
                // Decode still in flight; start once queue() completes.
                state.pendingStart = true;
                return;
            }
            this.stop();
            ctx.resume().catch(function() {});
            var source = ctx.createBufferSource();
            source.buffer = state.buffer;
            if (state.node) source.connect(state.node);
            state.source = source;
            state.startedAt = ctx.currentTime;
            source.onended = function() { if (state.source === source) state.source = null; };
            try { source.start(0); } catch (e) { state.source = null; }
        },
        stop: function() {
            state.pendingStart = false;
            if (!state.source) return;
            try { state.source.stop(); } catch (e) {}
            state.source = null;
        },
        sample: function() {
            if (!state.node || !state.source || !state.ctx || state.ctx.state !== 'running') return null;
            var w = state.node.weights;
            var volume = state.node.volume || 0;
            var a = (w.A || 0) * volume;
            var i = (w.I || 0) * volume;
            var u = (w.U || 0) * volume;
            var e = (w.E || 0) * volume;
            var o = (w.O || 0) * volume;
            if (a + i + u + e + o <= 0.01) return null;
            return {
                open: Math.min(1, a + 0.8 * o + 0.6 * e + 0.3 * i + 0.2 * u),
                form: Math.max(i, 0.4 * e) - Math.max(u, 0.7 * o),
                funnel: Math.max(u, 0.7 * o),
                stretch: Math.max(i, 0.4 * e)
            };
        },
        sampleEnvelope: function() {
            if (!state.buffer || !state.source || !state.ctx || state.ctx.state !== 'running') return null;
            var elapsed = state.ctx.currentTime - state.startedAt;
            if (elapsed < 0 || elapsed > state.buffer.duration) return null;
            var rate = state.buffer.sampleRate;
            var data = state.buffer.getChannelData(0);
            var start = Math.floor(elapsed * rate);
            var end = Math.min(start + Math.floor(rate * 0.05), data.length);
            var sum = 0;
            for (var i = start; i < end; i++) sum += data[i] * data[i];
            var rms = Math.sqrt(sum / Math.max(1, end - start));
            return { open: Math.min(1, rms * 6), form: 0, funnel: 0, stretch: 0 };
        }
    };
})();
</script>
<script>
var app = new PIXI.Application({
    view: document.getElementById('live2d'),
    autoStart: true,
    resizeTo: window,
    backgroundAlpha: 0,
});

var model = null;
window.modelReady = false;
var speaking = false;
var currentMode = 'idle';
var modeUntil = 0;
// ADR-0007 ownership: deadline of the presentation hold armed by the last
// qiuqiu-live2d-state apply (0 = none). While it is live the held body is
// backend-authoritative — the idle scheduler and the speaking-off mode reset
// skip instead of overriding it; once it elapses the phase/idle layer resumes.
var presentationHoldUntil = 0;
// HoldMS assumed when a qiuqiu-live2d-state apply does not state one: the
// PresentationPlan default hold (relationship/affect.go).
var PRESENTATION_DEFAULT_HOLD_MS = 1800;
var idleTimer = null;
var baseModelX = 0;
var baseModelY = 0;
var baseModelScale = 1;
var activePose = null;
var fxLayer = new PIXI.Container();
var fxItems = [];
// 表演映射单一源 (ADR-0007): expression/motion names resolve through
// presentation-map.json, fetched from the same asset tree as the model.
// Name-driven calls arriving before the map loads are buffered and replayed;
// a name without a row keeps the current body instead of snapping to the
// empty expression file.
var exprMap = {};
var motionMap = {};
var groupVariants = {};
var mapReady = false;
var pendingExpression = null;
var pendingMotion = null;
// Legacy names kept for senders predating the presentation map — mirrors
// CompanionPresentation.expressionAliases/motionAliases/legacyMotionNames in
// lib/services/presentation_state.dart (the first four expression entries are
// the page-internal actionMap mood names).
var expressionAliases = {
    low: 'sad',
    tense: 'nervous',
    deflated: 'sad',
    cheer: 'excited',
    complain: 'nervous',
    think: 'thinking',
    surprise: 'surprised',
};
var motionAliases = {
    celebrate_01: 'celebrate',
    cheer: 'celebrate',
    focus: 'listen_02',
    hold: 'listen_02',
    settle: 'idle_01',
    slump: 'idle_01',
    nod: 'agree',
    listening: 'listen',
    confused: 'idle',
};

fetch('/live2d-assets/models/qiuqiu/presentation-map.json')
    .then(function(resp) { return resp.json(); })
    .then(applyPresentationMap)
    .catch(function(e) {
        console.warn('presentation-map unavailable, keeping model defaults:', e);
        applyPresentationMap(null);
    });

function applyPresentationMap(map) {
    var expressions = map && map.expressions ? map.expressions : {};
    var motions = map && map.motions ? map.motions : {};
    for (var name in expressions) exprMap[name] = expressions[name];
    var variants = {};
    for (var key in motions) {
        var motion = motions[key];
        if (!motion || !motion.group) continue;
        var variant = motion.variant || 0;
        motionMap[key] = [motion.group, variant];
        if (!variants[motion.group]) variants[motion.group] = [];
        variants[motion.group].push([motion.group, variant]);
    }
    for (var group in variants) {
        variants[group].sort(function(a, b) { return a[1] - b[1]; });
        groupVariants[group] = variants[group];
    }
    mapReady = true;
    if (pendingExpression) {
        var expression = pendingExpression;
        pendingExpression = null;
        setExpression(expression);
    }
    if (pendingMotion) {
        var motion = pendingMotion;
        pendingMotion = null;
        playMotion(motion);
    }
}
var actionMap = {
    hello: { mood: 'happy', motion: 'hello', mode: 'event', ms: 2200, priority: 4, pose: 'sway', effect: 'greeting' },
    cheer: { mood: 'cheer', motion: 'cheer', mode: 'event', ms: 2400, priority: 4, pose: 'jump', effect: 'goalBurst' },
    celebrate: { mood: 'cheer', motion: 'celebrate', mode: 'event', ms: 2800, priority: 4, pose: 'jump', effect: 'goalBurst' },
    goal: { mood: 'cheer', motion: 'celebrate', mode: 'event', ms: 2800, priority: 4, pose: 'jump', effect: 'goalBurst' },
    miss: { mood: 'sad', motion: 'miss', mode: 'event', ms: 2400, priority: 4, pose: 'slump', effect: 'nearMiss' },
    complain: { mood: 'complain', motion: 'complain', mode: 'event', ms: 2400, priority: 4, pose: 'shake', effect: 'referee' },
    analysis: { mood: 'thinking', motion: 'analysis', mode: 'think', ms: 3200, priority: 3, pose: 'coach', effect: 'tactics' },
    tense: { mood: 'nervous', motion: 'tense', mode: 'event', ms: 2600, priority: 4, pose: 'leanIn', effect: 'heartbeat' },
    agree: { mood: 'happy', motion: 'agree', mode: 'listen', ms: 1400, priority: 2, pose: 'nod', effect: 'check' },
    wave: { mood: 'happy', motion: 'wave', mode: 'event', ms: 2000, priority: 3, pose: 'sway', effect: 'greeting' },
    listen: { mood: 'listening', motion: 'listen', mode: 'listen', ms: 2600, priority: 2 },
    listening: { mood: 'listening', motion: 'listen', mode: 'listen', ms: 2600, priority: 2 },
    speak: { mood: 'chat', motion: 'speak', mode: 'speak', ms: 3600, priority: 3 },
    think: { mood: 'thinking', motion: 'think', mode: 'think', ms: 2600, priority: 3 },
    thinking: { mood: 'thinking', motion: 'think', mode: 'think', ms: 2600, priority: 3 },
    surprise: { mood: 'surprised', motion: 'listen', mode: 'event', ms: 2000, priority: 4, pose: 'pop', effect: 'surprise' },
    angry: { mood: 'angry', motion: 'complain', mode: 'event', ms: 2400, priority: 4, pose: 'shake', effect: 'anger' },
    happy: { mood: 'happy', motion: 'speak', mode: 'event', ms: 2200, priority: 4, pose: 'bounce', effect: 'happyAura' },
    laugh: { mood: 'happy', motion: 'speak', mode: 'event', ms: 2200, priority: 3, pose: 'bounce', effect: 'laughBurst' },
    proud: { mood: 'cheer', motion: 'agree', mode: 'event', ms: 2200, priority: 3, pose: 'proud', effect: 'crown' },
    curious: { mood: 'surprised', motion: 'analysis', mode: 'event', ms: 2200, priority: 3, pose: 'tilt', effect: 'question' },
    comfort: { mood: 'sad', motion: 'agree', mode: 'event', ms: 2400, priority: 3, pose: 'soft', effect: 'heart' },
    bored: { mood: 'sad', motion: 'idle', mode: 'event', ms: 2600, priority: 2, pose: 'bored', effect: 'ellipsis' },
    // focus resolves through presentation-map.json (listen_02) like every
    // surface — the old inline "tense" interception was the one-word-two-
    // bodies bug (ADR-0007).
    focus: { mood: 'listening', motion: 'listen_02', mode: 'listen', ms: 2400, priority: 3, pose: 'focus', effect: 'focus' },
    idle: { mood: 'idle', motion: 'idle', mode: 'idle', ms: 1200, priority: 1 },
};

function resizeModel() {
    if (!model) return;
    model.anchor.set(0.5, 0);  // anchor top-center
    baseModelX = app.screen.width / 2;
    baseModelY = Math.max(12, app.screen.height * 0.03);
    var s = Math.min(app.screen.width / 700, app.screen.height / 1000);
    baseModelScale = s * 0.28;  // keep the head visible in short mobile panes
    applyPoseFrame();
}

async function loadModel() {
    try {
        var L2D = window.Live2DModel || Live2DModel;
        model = await L2D.from(
            '/live2d-assets/models/qiuqiu/female_01Arkit_6.model3.json?v=motionpack1',
            { autoUpdate: true, autoInteract: false }
        );
        app.stage.addChild(model);
        app.stage.addChild(fxLayer);
        resizeModel();
        window.addEventListener('resize', resizeModel);
        window.modelReady = true;
        setMood('idle');
        scheduleIdle();
        try { window.flutter_inappwebview.postMessage(JSON.stringify({type:'ready'})); } catch(_) {}
    } catch(e) {
        console.error('Live2D load error:', e);
        window.modelReady = true;
        try { window.flutter_inappwebview.postMessage(JSON.stringify({type:'ready'})); } catch(_) {}
    }
}

function setExpression(name) {
    setMood(name);
}

function playMotion(name) {
    playMotionGroup(name, 3);
}

function pick(list) {
    return list[Math.floor(Math.random() * list.length)];
}

function setMood(name) {
    if (!mapReady) {
        pendingExpression = name;
        return;
    }
    var canonical = expressionAliases[name] || name;
    var idx = exprMap[canonical];
    if (typeof idx !== 'number') return;
    try { if (model) model.expression(idx); } catch(e) {}
}

function canInterrupt(priority) {
    if (!model) return false;
    if (Date.now() > modeUntil) return true;
    var currentPriority = currentMode === 'speak' ? 3 : currentMode === 'listen' || currentMode === 'think' ? 2 : currentMode === 'event' ? 4 : 1;
    return priority >= currentPriority;
}

function playMotionGroup(group, priority) {
    if (!model) return;
    if (!mapReady) {
        pendingMotion = group;
        return;
    }
    var motions = resolveMotions(group);
    if (!motions) return;
    priority = priority || 1;
    if (!canInterrupt(priority)) return;
    var m = pick(motions);
    try { model.motion(m[0], m[1], 3); } catch(e) {}
}

// Group names (`celebrate`, `idle`, …) pick among the group's variants;
// exact motion names play their single row. Unknown names stay put.
function resolveMotions(name) {
    var canonical = motionAliases[name] || name;
    if (groupVariants[canonical]) return groupVariants[canonical];
    if (motionMap[canonical]) return [motionMap[canonical]];
    return groupVariants.idle || null;
}

function startPose(kind, ms) {
    if (!kind) return;
    activePose = { kind: kind, start: performance.now(), ms: ms || 1800 };
}

function easeOut(t) {
    return 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
}

function applyPoseFrame() {
    if (!model) return;
    var x = baseModelX;
    var y = baseModelY;
    var scale = baseModelScale;
    var rotation = 0;
    if (activePose) {
        var now = performance.now();
        var p = Math.min(1, (now - activePose.start) / activePose.ms);
        var fade = 1 - easeOut(p);
        var wave = Math.sin(p * Math.PI * 2);
        var fast = Math.sin(p * Math.PI * 10);
        switch (activePose.kind) {
        case 'jump':
            y -= Math.abs(Math.sin(p * Math.PI * 4)) * 44 * fade;
            scale *= 1 + Math.abs(Math.sin(p * Math.PI * 4)) * 0.035 * fade;
            rotation = Math.sin(p * Math.PI * 6) * 0.035 * fade;
            break;
        case 'shake':
            x += fast * 14 * fade;
            rotation = fast * 0.055 * fade;
            break;
        case 'sway':
            x += wave * 18 * fade;
            rotation = wave * 0.035 * fade;
            break;
        case 'slump':
            y += easeOut(Math.min(p * 1.3, 1)) * 18 * fade;
            rotation = -0.05 * fade;
            break;
        case 'tremble':
            x += fast * 7 * fade;
            y += Math.sin(p * Math.PI * 14) * 3 * fade;
            break;
        case 'thoughtful':
            rotation = Math.sin(p * Math.PI * 2) * 0.025 * fade;
            y += Math.sin(p * Math.PI * 2) * 6 * fade;
            break;
        case 'coach':
            x -= easeOut(Math.min(p * 1.4, 1)) * 18 * fade;
            rotation = -0.035 * fade;
            y += Math.sin(p * Math.PI * 1.5) * 4 * fade;
            break;
        case 'leanIn':
            y -= easeOut(Math.min(p * 1.6, 1)) * 18 * fade;
            scale *= 1 + 0.035 * fade;
            x += fast * 3 * fade;
            break;
        case 'bounce':
            y -= Math.abs(Math.sin(p * Math.PI * 5)) * 26 * fade;
            scale *= 1 + Math.abs(Math.sin(p * Math.PI * 5)) * 0.025 * fade;
            break;
        case 'proud':
            y -= easeOut(Math.min(p * 1.3, 1)) * 12 * fade;
            scale *= 1 + 0.025 * fade;
            rotation = Math.sin(p * Math.PI * 2) * 0.018 * fade;
            break;
        case 'tilt':
            rotation = -0.12 * fade;
            x += Math.sin(p * Math.PI * 2) * 10 * fade;
            break;
        case 'soft':
            y += Math.sin(p * Math.PI) * 12 * fade;
            rotation = 0.045 * fade;
            break;
        case 'bored':
            y += easeOut(Math.min(p * 1.2, 1)) * 22 * fade;
            rotation = -0.075 * fade;
            break;
        case 'focus':
            y -= 10 * fade;
            scale *= 1 + 0.02 * fade;
            break;
        case 'nod':
            y += Math.sin(p * Math.PI * 4) * 8 * fade;
            break;
        case 'pop':
            scale *= 1 + Math.sin(Math.min(p * 2, 1) * Math.PI) * 0.055;
            break;
        }
        if (p >= 1) activePose = null;
    }
    model.x = x;
    model.y = y;
    model.scale.set(scale);
    model.rotation = rotation;
}

function addParticle(display, vx, vy, life, spin, grow) {
    fxLayer.addChild(display);
    fxItems.push({ display: display, vx: vx || 0, vy: vy || 0, life: life || 1000, age: 0, spin: spin || 0, grow: !!grow });
}

function drawStar(g, x, y, r, color) {
    g.beginFill(color);
    for (var i = 0; i < 10; i++) {
        var a = -Math.PI / 2 + i * Math.PI / 5;
        var rr = i % 2 === 0 ? r : r * 0.45;
        var px = x + Math.cos(a) * rr;
        var py = y + Math.sin(a) * rr;
        if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.endFill();
}

function drawBall(g, x, y, r) {
    g.beginFill(0xffffff);
    g.lineStyle(2, 0x111827, 0.9);
    g.drawCircle(x, y, r);
    g.endFill();
    g.lineStyle(1.5, 0x111827, 0.75);
    g.moveTo(x - r * 0.6, y); g.lineTo(x + r * 0.6, y);
    g.moveTo(x, y - r * 0.6); g.lineTo(x, y + r * 0.6);
}

function drawCheck(g, x, y, scale, color) {
    g.lineStyle(6 * scale, color, 0.95);
    g.moveTo(x - 18 * scale, y);
    g.lineTo(x - 4 * scale, y + 14 * scale);
    g.lineTo(x + 24 * scale, y - 18 * scale);
}

function drawCrown(g, x, y, scale, color) {
    g.beginFill(color, 0.95);
    g.moveTo(x - 36 * scale, y + 18 * scale);
    g.lineTo(x - 28 * scale, y - 16 * scale);
    g.lineTo(x - 10 * scale, y + 4 * scale);
    g.lineTo(x, y - 24 * scale);
    g.lineTo(x + 10 * scale, y + 4 * scale);
    g.lineTo(x + 28 * scale, y - 16 * scale);
    g.lineTo(x + 36 * scale, y + 18 * scale);
    g.closePath();
    g.endFill();
    g.lineStyle(2 * scale, 0xffffff, 0.75);
    g.moveTo(x - 28 * scale, y + 20 * scale);
    g.lineTo(x + 28 * scale, y + 20 * scale);
}

function drawWhistle(g, x, y, scale) {
    g.lineStyle(3 * scale, 0xffffff, 0.9);
    g.beginFill(0x111827, 0.86);
    g.drawRoundedRect(x - 28 * scale, y - 12 * scale, 42 * scale, 24 * scale, 8 * scale);
    g.endFill();
    g.beginFill(0xffffff, 0.92);
    g.drawCircle(x + 16 * scale, y, 12 * scale);
    g.endFill();
    g.beginFill(0x111827, 0.86);
    g.drawCircle(x + 16 * scale, y, 5 * scale);
    g.endFill();
    g.lineStyle(3 * scale, 0xffffff, 0.9);
    g.moveTo(x - 30 * scale, y);
    g.lineTo(x - 48 * scale, y - 10 * scale);
}

function drawHeart(g, x, y, r, color, alpha) {
    g.beginFill(color, alpha == null ? 1 : alpha);
    g.moveTo(x, y + r * 0.45);
    g.bezierCurveTo(x - r * 1.35, y - r * 0.35, x - r * 0.7, y - r * 1.2, x, y - r * 0.45);
    g.bezierCurveTo(x + r * 0.7, y - r * 1.2, x + r * 1.35, y - r * 0.35, x, y + r * 0.45);
    g.endFill();
}

function addSoftCircle(x, y, r, color, alpha, life) {
    var g = new PIXI.Graphics();
    g.beginFill(color, alpha);
    g.drawCircle(0, 0, r);
    g.endFill();
    g.x = x;
    g.y = y;
    addParticle(g, 0, 0, life || 900, 0, true);
}

function addTextParticle(text, x, y, color, size, vx, vy, life) {
    var t = new PIXI.Text(text, {
        fontFamily: 'Arial, sans-serif',
        fontSize: size || 28,
        fontWeight: '700',
        fill: color || 0xffffff,
        stroke: 0x111827,
        strokeThickness: 3,
    });
    t.anchor.set(0.5);
    t.x = x;
    t.y = y;
    addParticle(t, vx || 0, vy || -0.6, life || 900, 0);
}

function spawnEffect(kind) {
    if (!fxLayer) return;
    if (kind === 'goalBurst') {
        addSoftCircle(baseModelX, baseModelY + 115, 120, 0xf6c85f, 0.13, 850);
        addSoftCircle(baseModelX, baseModelY + 115, 70, 0xffffff, 0.10, 700);
        var arc = new PIXI.Graphics();
        arc.lineStyle(5, 0xf6c85f, 0.75);
        arc.arc(0, 0, 72, Math.PI * 0.15, Math.PI * 0.85);
        arc.lineStyle(3, 0x62d879, 0.65);
        arc.arc(0, 0, 92, Math.PI * 1.1, Math.PI * 1.85);
        arc.x = baseModelX;
        arc.y = baseModelY + 120;
        addParticle(arc, 0, -0.5, 950, 0.035);
        var colors = [0xe85d2a, 0xf6c85f, 0x62d879, 0x4da3ff, 0xffffff];
        for (var i = 0; i < 22; i++) {
            var g = new PIXI.Graphics();
            if (i % 4 === 0) drawStar(g, 0, 0, 8, colors[i % colors.length]);
            else {
                g.beginFill(colors[i % colors.length], 0.92);
                g.drawRoundedRect(-3, -8, 6, 16, 2);
                g.endFill();
            }
            g.x = app.screen.width * (0.25 + Math.random() * 0.5);
            g.y = app.screen.height * (0.12 + Math.random() * 0.18);
            g.rotation = Math.random() * Math.PI;
            addParticle(g, (Math.random() - 0.5) * 4.5, 1.5 + Math.random() * 3.5, 1200 + Math.random() * 700, (Math.random() - 0.5) * 0.22);
        }
        for (var b = 0; b < 4; b++) {
            var ball = new PIXI.Graphics();
            drawBall(ball, 0, 0, 12);
            ball.x = baseModelX + (b - 1.5) * 46;
            ball.y = baseModelY + 80 + Math.random() * 50;
            addParticle(ball, (b - 1.5) * 1.4, -2.8 - Math.random(), 1100, 0.16);
        }
        addTextParticle('GOAL', baseModelX, baseModelY + 52, 0xf6c85f, 32, 0, -1.0, 900);
    } else if (kind === 'greeting') {

function updateEffects(delta) {
    for (var i = fxItems.length - 1; i >= 0; i--) {
        var item = fxItems[i];
        item.age += delta * 16.67;
        item.display.x += item.vx * delta;
        item.display.y += item.vy * delta;
        item.display.rotation += item.spin * delta;
        if (item.grow && item.display.scale) {
            var growth = item.age / item.life;
            item.display.scale.set(0.55 + growth * 1.15);
        }
        item.display.alpha = Math.max(0, 1 - item.age / item.life);
        if (item.age >= item.life) {
            if (item.display.parent) item.display.parent.removeChild(item.display);
            item.display.destroy();
            fxItems.splice(i, 1);
        }
    }
}

function performAction(action) {
    var config = actionMap[action] || actionMap.idle;
    if (!canInterrupt(config.priority)) return;
    currentMode = config.mode;
    document.body.dataset.mode = currentMode;
    document.body.dataset.motion = config.motion;
    document.body.dataset.mood = config.mood;
    modeUntil = Date.now() + config.ms;
    setMood(config.mood);
    playMotionGroup(config.motion, config.priority);
    startPose(config.pose, config.ms);
    spawnEffect(config.effect);
    if (config.mode !== 'idle') scheduleIdle();
}

// ADR-0007 ownership: the idle scheduler only fills idle-phase gaps — it
// yields while TTS audio is speaking and while a presentation hold is live
// (modeUntil armed by armPresentationHold); after the hold elapses the
// phase/idle layer resumes and the tick re-fills the body.
function scheduleIdle() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(function() {
        if (!speaking && Date.now() > modeUntil) {
            performAction('idle');
        }
        scheduleIdle();
    }, 8000 + Math.random() * 6000);
}

// presentation-mapping 3.1 (ADR-0007 ownership): a qiuqiu-live2d-state
// presentation apply arms the HoldMS window on the existing modeUntil
// deadline, so scheduleIdle and the speaking-off mode reset cannot override
// the held body while it is live. Idle-phase applies (phases.idle = the
// affect idle tier, the client idle layer itself) arm nothing — the idle
// scheduler only fills when no presentation is held and the phase is idle.
function armPresentationHold(data) {
    var motion = data.motion ? (motionAliases[data.motion] || data.motion) : '';
    if (currentMode === 'idle' || motion === 'idle' || motion === 'idle_01' || motion === 'idle_02' || motion === 'idle_03') return;
    var holdMS = typeof data.holdMs === 'number' && data.holdMs >= 0
        ? Math.min(data.holdMs, 10000)
        : PRESENTATION_DEFAULT_HOLD_MS;
    presentationHoldUntil = Date.now() + holdMS;
    if (presentationHoldUntil > modeUntil) modeUntil = presentationHoldUntil;
}

function setSpeaking(v) {
    speaking = v;
    document.body.dataset.speaking = v ? 'true' : 'false';
    if (v) {
        currentMode = 'speak';
        // The speak window never shortens a live presentation hold.
        var speakUntil = Date.now() + 3000;
        if (speakUntil > modeUntil) modeUntil = speakUntil;
    } else if (Date.now() < presentationHoldUntil) {
        // A presentation hold is live: the mode reset must not cut it short.
        scheduleIdle();
    } else {
        presentationHoldUntil = 0;
        currentMode = 'idle';
        modeUntil = 0;
        scheduleIdle();
    }
}

window.addEventListener('message', function(event) {
    if (event.source !== window.parent) return;
    var data = event.data;
    if (!data || typeof data.type !== 'string') return;
    if (data.type === 'qiuqiu-live2d-audio') {
        if (window.qLipSync) window.qLipSync.queue(data.audio);
        return;
    }
    if (data.type === 'qiuqiu-live2d-lipsync') {
        if (!window.qLipSync) return;
        if (data.command === 'start') window.qLipSync.start();
        else window.qLipSync.stop();
        return;
    }
    if (data.type !== 'qiuqiu-live2d-state') return;
    if (data.expression) setExpression(data.expression);
    if (data.motion) {
        if (actionMap[data.motion]) performAction(data.motion);
        else playMotion(data.motion);
    }
    // Arm the hold before the speaking update so the mode reset below cannot
    // erase a hold this same apply just started (ADR-0007 ownership).
    armPresentationHold(data);
    setSpeaking(data.speaking === true);
});

var mouth = { open: 0, form: 0, funnel: 0, stretch: 0 };

function applyMouth() {
    if (!model) return;
    try {
        var core = model.internalModel.coreModel;
        core.setParameterValueById('ParamMouthOpenY', mouth.open);
        core.setParameterValueById('ParamJawOpen', mouth.open);
        core.setParameterValueById('ParamMouthForm', mouth.form);
        core.setParameterValueById('ParamMouthFunnel', mouth.funnel);
        core.setParameterValueById('ParamMouthStretchLeft', mouth.stretch);
        core.setParameterValueById('ParamMouthStretchRight', mouth.stretch);
    } catch(e) {}
}

setInterval(function() {
    if (!model) return;
    var target = { open: 0, form: 0, funnel: 0, stretch: 0 };
    if (speaking) {
        var q = window.qLipSync;
        var viseme = q ? q.sample() : null;
        var envelope = viseme || (q ? q.sampleEnvelope() : null);
        if (viseme) {
            target = viseme;
        } else if (envelope) {
            target = envelope;
        } else {
            // Analyser not ready (vendor libs missing or audio not decoded):
            // legacy random jaw jitter keeps the mouth alive.
            target.open = 0.25 + Math.random() * 0.75;
        }
    }
    mouth.open += (target.open - mouth.open) * 0.5;
    mouth.form += (target.form - mouth.form) * 0.3;
    mouth.funnel += (target.funnel - mouth.funnel) * 0.4;
    mouth.stretch += (target.stretch - mouth.stretch) * 0.4;
    applyMouth();
}, 50);

app.ticker.add(function(delta) {
    applyPoseFrame();
    updateEffects(delta);
});

// === Web Audio Recording + VAD ===
var audioCtx=null, mediaStream=null, recorderNode=null, audioChunks=[];
var isRecording=false, vadSpeaking=false, silenceTimer=null, speechFrames=0;
window.vadResult=null;

async function startRecording() {
    if(isRecording)return {ok:true};
    try{
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
            window.vadResult=JSON.stringify({event:'error',reason:'microphone unavailable'});
            return {ok:false,reason:'microphone unavailable'};
        }
        mediaStream=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000,channelCount:1,echoCancellation:!0}});
        audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
        var src=audioCtx.createMediaStreamSource(mediaStream);
        var processor=audioCtx.createScriptProcessor(4096,1,1);
        src.connect(processor);processor.connect(audioCtx.destination);
        isRecording=true;audioChunks=[];speechFrames=0;vadSpeaking=false;
        processor.onaudioprocess=function(e){
            if(!isRecording)return;
            var input=e.inputBuffer.getChannelData(0);
            var pcm=new Int16Array(input.length);
            var sum=0;
            for(var i=0;i<input.length;i++){var s=Math.max(-1,Math.min(1,input[i]));pcm[i]=s*0x7FFF;sum+=s*s}
            var rms=Math.sqrt(sum/input.length);
            audioChunks.push(pcm);
            if(rms>0.02){
                speechFrames++;
                if(speechFrames===5){vadSpeaking=true;window.vadResult=JSON.stringify({event:'speaking'})}
                silenceTimer&&clearTimeout(silenceTimer);silenceTimer=null;
            }else if(vadSpeaking){
                silenceTimer=setTimeout(function(){
                    isRecording=false;vadSpeaking=false;speechFrames=0;
                    var totalLen=audioChunks.reduce(function(a,b){return a+b.length},0);
                    var buf=new Int16Array(totalLen),off=0;
                    for(var i=0;i<audioChunks.length;i++){buf.set(audioChunks[i],off);off+=audioChunks[i].length}
                    var bytes=new Uint8Array(buf.buffer);
                    var b64='';for(var i=0;i<bytes.length;i++)b64+=String.fromCharCode(bytes[i]);
                    window.vadResult=JSON.stringify({event:'sentenceEnd',audio:btoa(b64)});
                    audioChunks=[];silenceTimer=null;
                    mediaStream.getTracks().forEach(function(t){t.stop()});
                    audioCtx.close();audioCtx=null;
                },800);
            }
        };
        return {ok:true};
    }catch(e){
        console.error('mic error:',e);
        window.vadResult=JSON.stringify({event:'error',reason:e&&e.message?e.message:'microphone failed'});
        return {ok:false,reason:e&&e.message?e.message:'microphone failed'};
    }
}
function stopRecording(){
    isRecording=false;
    silenceTimer&&clearTimeout(silenceTimer);
    if(vadSpeaking){
        var totalLen=audioChunks.reduce(function(a,b){return a+b.length},0);
        var buf=new Int16Array(totalLen),off=0;
        for(var i=0;i<audioChunks.length;i++){buf.set(audioChunks[i],off);off+=audioChunks[i].length}
        var bytes=new Uint8Array(buf.buffer);
        var b64='';for(var i=0;i<bytes.length;i++)b64+=String.fromCharCode(bytes[i]);
        window.vadResult=JSON.stringify({event:'sentenceEnd',audio:btoa(b64)});
    }
    audioChunks=[];speechFrames=0;vadSpeaking=false;
    if(mediaStream){mediaStream.getTracks().forEach(function(t){t.stop()});mediaStream=null}
    if(audioCtx){audioCtx.close();audioCtx=null}
}
function getVAD(){var r=window.vadResult;window.vadResult=null;return r||'null'}

window.setExpression = setExpression;
window.playMotion = playMotion;
window.setSpeaking = setSpeaking;
window.setMood = setMood;
window.playMotionGroup = playMotionGroup;
window.performAction = performAction;
window.startRecording = startRecording;
window.stopRecording = stopRecording;
window.getVAD = getVAD;

loadModel();
