<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>球球动作测试</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #10131a; color: #f5f7fb; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-columns: minmax(360px, 1fr) 380px; height: 100vh; overflow: hidden; }
  .stage { position: relative; background: radial-gradient(circle at 50% 18%, #2a3140 0, #141922 42%, #10131a 100%); overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .panel { overflow-y: auto; padding: 18px; background: #f5f7fb; color: #161b24; border-left: 1px solid #d9dee8; }
  h1 { margin: 0 0 6px; font-size: 18px; }
  h2 { margin: 18px 0 8px; font-size: 13px; color: #5c6677; }
  p { margin: 0 0 14px; color: #5c6677; font-size: 13px; line-height: 1.45; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  button { min-height: 36px; border: 1px solid #cdd5e1; border-radius: 8px; background: white; color: #1f2937; cursor: pointer; font: inherit; }
  button:hover { border-color: #1b6fd8; box-shadow: 0 0 0 3px rgba(27,111,216,.12); }
  .primary { background: #e85d2a; border-color: #e85d2a; color: white; font-weight: 700; }
  .danger { background: #d92d20; border-color: #d92d20; color: white; font-weight: 700; }
  .label { margin-top: 14px; padding: 10px; border: 1px solid #dbe1eb; border-radius: 8px; min-height: 42px; background: white; font-size: 13px; }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55dvh 45dvh; }
    .panel { border-left: 0; border-top: 1px solid #d9dee8; }
  }
</style>
</head>
<body>
  <section class="stage">
    <iframe id="live2d" src="/live2d.html" title="Live2D 球球"></iframe>
  </section>
  <aside class="panel">
    <h1>球球动作测试</h1>
    <p>这里测试 app 会调用的语义动作。进球、分析、紧张和生气都有独立的肢体与特效语汇。</p>

    <h2>足球场景动作</h2>
    <div class="grid">
      <button data-action="wave">wave 开场挥手</button>
      <button class="primary" data-action="celebrate">celebrate 进球跳跃</button>
      <button data-action="miss">miss 可惜下沉</button>
      <button data-action="complain">complain 吐槽摇头</button>
      <button class="danger" data-action="angry">angry 生气特效</button>
      <button data-action="analysis">analysis 分析思考</button>
      <button data-action="tense">tense 紧张脉冲</button>
      <button data-action="surprise">surprise 惊讶闪线</button>
    </div>

    <h2>陪伴情绪动作</h2>
    <div class="grid">
      <button data-action="laugh">laugh 开心闪光</button>
      <button data-action="proud">proud 得意高光</button>
      <button data-action="curious">curious 好奇问号</button>
      <button data-action="comfort">comfort 安慰爱心</button>
      <button data-action="bored">bored 无聊省略号</button>
      <button data-action="focus">focus 专注准星</button>
    </div>

    <h2>基础动作</h2>
    <div class="grid">
      <button data-action="idle">idle</button>
      <button data-action="listen">listen</button>
      <button data-action="speak" data-speaking="true">speak + mouth</button>
      <button data-action="think">think</button>
      <button data-action="hello">hello</button>
      <button data-action="agree">agree 点头</button>
      <button data-action="happy">happy</button>
    </div>

    <h2>表情索引</h2>
    <div class="grid">
      <button data-expression="idle">idle</button>
      <button data-expression="cheer">cheer</button>
      <button data-expression="chat">chat</button>
      <button data-expression="sad">sad</button>
      <button data-expression="surprised">surprised</button>
      <button data-expression="angry">angry</button>
    </div>

    <div class="label" id="label">等待 Live2D 加载...</div>
  </aside>

<script>
const frame = document.getElementById('live2d');
const label = document.getElementById('label');
let speakingTimer = null;

function liveCall(name, arg) {
  try {
    const win = frame.contentWindow;
    if (win && typeof win[name] === 'function') {
      win[name](arg);
      return true;
    }
  } catch (_) {}
  return false;
}

function setLabel(text) {
  label.textContent = text;
}

function runAction(action, speaking) {
  clearTimeout(speakingTimer);
  const ok = liveCall('performAction', action);
  if (speaking) {
    liveCall('setSpeaking', true);
    speakingTimer = setTimeout(() => {
      liveCall('setSpeaking', false);
      liveCall('performAction', 'idle');
    }, 3200);
  }
  setLabel(ok ? `已触发动作：${action}` : `动作暂不可用：${action}`);
}

document.querySelectorAll('[data-action]').forEach((button) => {
  button.addEventListener('click', () => runAction(button.dataset.action, button.dataset.speaking === 'true'));
});

document.querySelectorAll('[data-expression]').forEach((button) => {
  button.addEventListener('click', () => {
    const expression = button.dataset.expression;
    const ok = liveCall('setMood', expression);
    setLabel(ok ? `已切换表情：${expression}` : `表情暂不可用：${expression}`);
  });
});

frame.addEventListener('load', () => {
  setTimeout(() => {
    const ready = frame.contentWindow && frame.contentWindow.modelReady;
    setLabel(ready ? 'Live2D 已加载，可以开始测试。' : 'Live2D 正在加载，稍等一下再点。');
  }, 800);
});
</script>
</body>
</html>
