name: Evals

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: go test ./...
        working-directory: backend
      # console 契约锁（console-contract-goldens）：编译错误与形状漂移的
      # TS 侧在此拦截；dist 同时供 browser 档 evals 的 /console 页面使用。
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      - run: npm run build
        working-directory: console
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: dart analyze lib test
        working-directory: client
      - run: flutter test
        working-directory: client
      - run: flutter build web --release
        working-directory: client
      # Playwright 浏览器缓存：key 绑定 @playwright/test 版本，升级即失效重装。
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: node scripts/evals/run.mjs --tier pr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qiuqiu-eval-artifacts
          path: artifacts/evals/
          if-no-files-found: ignore

  # promptfoo 宪法负例门禁（eval-tooling 9.2）：确定性 javascript 断言
  # （不错报比分/不附和错误比分/用户话轮优先）失败即红，阻断 merge。
  # 与观测层（promptfoo-observability）分立：judge 报告永不参与门禁。
  # 本地等价入口：node scripts/promptfoo/run-gate.mjs（注错验红已本地过）。
  promptfoo-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Run promptfoo gate (starts eval backend itself)
        run: node scripts/promptfoo/run-gate.mjs
        env:
          # 无头 CI 下 WebSocket 连接本机 eval backend，无需任何模型 key
          # （门禁断言全确定性，judge 不参与）。
          CI: 'true'
