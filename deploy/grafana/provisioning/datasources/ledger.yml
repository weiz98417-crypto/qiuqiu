# Grafana provisioning（ADR-0021）：datasource 与 dashboard 全部声明式，
# 重启即加载；改面板走 PR 评审——面板 SQL 就是指标定义。
apiVersion: 1

datasources:
  - name: qiuqiu-ledger
    # uid 必须显式固定：dashboard JSON 的 datasource 引用按 uid 解析，
    # 缺省时 Grafana 生成随机 uid，面板全部查无此源。
    uid: qiuqiu-ledger
    type: postgres
    access: proxy
    url: 127.0.0.1:5432
    user: qiuqiu_grafana_ro
    secureJsonData:
      password: ${GRAFANA_RO_PASSWORD}
    jsonData:
      # database 必须在 jsonData（Grafana 13 postgres 插件前端校验位）——
      # 顶层 database 字段是旧形态，后端健康检查不查它、前端查询直接报
      # 「no default database」（面板全 No data 的根因）。
      database: qiuqiu_test
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    isDefault: true
    readOnly: true
