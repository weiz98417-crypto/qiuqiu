# Grafana provisioning（ADR-0021）：datasource 与 dashboard 全部声明式，
# 重启即加载；改面板走 PR 评审——面板 SQL 就是指标定义。
apiVersion: 1

datasources:
  - name: qiuqiu-ledger
    type: postgres
    access: proxy
    url: 127.0.0.1:5432
    # 本机闭环用 qiuqiu_test（portable PG）；compose 部署（POSTGRES_DB=qiuqiu）改 qiuqiu。
    database: qiuqiu_test
    user: qiuqiu_grafana_ro
    secureJsonData:
      password: ${GRAFANA_RO_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    isDefault: true
    readOnly: true
