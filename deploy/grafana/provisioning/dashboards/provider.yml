# Grafana provisioning：dashboard 来源（ADR-0021 provisioning as code）。
apiVersion: 1

providers:
  - name: qiuqiu-operations
    orgId: 1
    folder: qiuqiu-operations
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # 环境变量插值（Grafana provisioning 原生支持）：compose 设
      # GRAFANA_DASHBOARDS_DIR=/etc/grafana/provisioning/dashboards；
      # Windows 本机闭环设为仓库 deploy/grafana/provisioning/dashboards
      # 的绝对路径（见 README 起动命令）。
      path: ${GRAFANA_DASHBOARDS_DIR}
      foldersFromFilesStructure: false
